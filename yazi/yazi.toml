[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

[opener]
browser = [
	{ run = 'xdg-open "$@"', orphan = true, desc = "Default app", for = "linux" },
]

[open]
prepend_rules = [
	{ mime = "text/html", use = "browser" },
	{ url = "*.{html,htm,xhtml}", use = "browser" },
]

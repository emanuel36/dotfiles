[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Open the hovered file or enter the hovered directory"

[[mgr.prepend_keymap]]
on   = "<A-d>"
run  = "plugin diff"
desc = "Diff the selected with the hovered file"

[[mgr.prepend_keymap]]
on   = "c"
run  = """shell -- python3 -c 'import sys,pathlib; print("copy\\n" + "\\n".join(pathlib.Path(p).resolve().as_uri() for p in sys.argv[1:]), end="")' "$@" | xclip -i -selection clipboard -t x-special/gnome-copied-files"""
desc = "Copy the selected files to the system clipboard"

[[mgr.prepend_keymap]]
on   = "<Backspace>"
run  = "leave"
desc = "Go back to the parent directory"
